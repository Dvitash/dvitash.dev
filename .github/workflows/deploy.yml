name: Deploy to Oracle VPS

on:
  push:
    branches: [main]

env:
  ORACLE_HOST: 129.213.144.43
  ORACLE_USER: opc
  SITE_DIR: /mnt/block/dvitash.dev/site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Sync code to Oracle
        run: |
          rsync -az --delete --exclude node_modules --exclude .next \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$ORACLE_USER@$ORACLE_HOST:$SITE_DIR/"

      - name: Install, build, restart
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$ORACLE_USER@$ORACLE_HOST" \
            "cd $SITE_DIR && npm ci --no-audit --no-fund && npm run build && systemctl --user restart dvitash-web.service"

      - name: Test local render on Oracle
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$ORACLE_USER@$ORACLE_HOST" \
            "sleep 8 && systemctl --user is-active dvitash-web.service && \
             curl -sf -m 20 http://127.0.0.1:3100/ -o /tmp/dv-home.html && \
             grep -q 'TOKEN USAGE' /tmp/dv-home.html && \
             curl -sf -m 20 http://127.0.0.1:3100/experience -o /dev/null"

      - name: Test public site
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for i in 1 2 3 4 5 6; do
            if curl -sf -m 25 -A "$UA" https://dvitash.dev/ -o /tmp/pub-home.html; then
              break
            fi
            echo "public check attempt $i failed, retrying..."
            sleep 20
          done
          grep -q 'TOKEN USAGE' /tmp/pub-home.html
          test "$(grep -o 'height:[0-9.]*%' /tmp/pub-home.html | wc -l)" -ge 30
          curl -sf -m 25 -A "$UA" https://dvitash.dev/experience -o /dev/null
          echo "public site OK"
